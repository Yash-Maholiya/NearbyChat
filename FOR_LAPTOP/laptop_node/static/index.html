<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NearbyChat Node</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: #222; font: 14px Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #ccc;
    background: #f4f4f4; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  .chip { font-size: 12px; color: #555; }
  .chip.on { color: green; }
  .mono { font-family: Consolas, monospace; }
  main { display: grid; grid-template-columns: 280px 1fr 420px; height: calc(100% - 40px); }
  section { border-right: 1px solid #ccc; display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid #ccc; background: #fafafa; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }
  .peer { padding: 8px 12px; border-bottom: 1px solid #e5e5e5; cursor: pointer; }
  .peer:hover { background: #f6f6f6; }
  .peer.active { background: #e8f0fe; }
  .peer .top { display: flex; justify-content: space-between; align-items: center; }
  .peer .name { font-weight: bold; }
  .peer .meta { color: #666; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #bbb; }
  .dot.on { background: green; }
  .kind { font-size: 11px; color: #777; }
  .routebox { margin-top: 4px; font-size: 12px; }
  select, input, button { font: inherit; }
  button { cursor: pointer; }
  .chat-head { padding: 8px 12px; border-bottom: 1px solid #ccc; }
  .chat-head .safety { color: #666; font-size: 12px; }
  .msgs { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 70%; padding: 6px 10px; border-radius: 4px; background: #eee; align-self: flex-start; }
  .bubble.mine { background: #dbe8fb; align-self: flex-end; }
  .bubble .st { font-size: 11px; color: #666; margin-top: 2px; }
  .bubble .st.failed { color: red; }
  .composer { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid #ccc; }
  .composer input { flex: 1; padding: 5px; }
  .empty { color: #777; padding: 20px; text-align: center; }
  .tools { padding: 8px 12px; border-bottom: 1px solid #ccc; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pkt { padding: 5px 12px; border-bottom: 1px solid #e5e5e5; font-size: 12px; cursor: pointer; }
  .pkt .row1 { display: flex; gap: 8px; align-items: center; }
  .tag { font-weight: bold; font-size: 11px; }
  .in { color: green; } .out { color: blue; } .relay { color: purple; } .drop, .replay { color: red; }
  .pkt .ct { color: #666; word-break: break-all; }
  .pkt pre { display: none; white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 6px; margin: 4px 0 0; }
  .pkt.open pre { display: block; }
  .log { padding: 4px 12px; font-size: 12px; border-bottom: 1px solid #eee; }
  .log.ok { color: green; } .log.warn { color: #b36b00; } .log.error { color: red; } .log.info { color: #333; }
  .tabs { display: flex; border-bottom: 1px solid #ccc; }
  .tabs button { flex: 1; border: 0; background: #fafafa; padding: 6px; }
  .tabs button.sel { background: #fff; font-weight: bold; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } section { min-height: 50vh; } }
</style>
</head>
<body>
<header>
  <h1 id="me">NearbyChat node</h1>
  <span class="chip mono" id="fp"></span>
  <span id="links"></span>
  <span class="chip" id="stats"></span>
  <span style="flex:1"></span>
  <span class="chip" id="conn">connecting...</span>
</header>
<main>
  <section>
    <h2>Mesh (Bluetooth only)</h2>
    <div class="scroll" id="peers"><div class="empty">Scanning...</div></div>
  </section>
  <section>
    <div class="chat-head" id="chathead"><div class="empty" style="padding:0;text-align:left">Pick a device on the left</div></div>
    <div class="scroll msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <input id="text" placeholder="Type an encrypted message" autocomplete="off">
      <button id="sendbtn">Send</button>
    </form>
  </section>
  <section style="border-right:0">
    <div class="tools">
      <label><input type="checkbox" id="relay" checked> Relay for others</label>
      <button id="tamper" title="Flip one ciphertext bit in the next private message this laptop relays or sends">Tamper next message</button>
      <button id="replay" title="Send the last relayed packet again">Replay last</button>
    </div>
    <div class="tabs"><button class="sel" data-tab="pk">Packets</button><button data-tab="lg">Events</button></div>
    <div class="scroll" id="pk"></div>
    <div class="scroll" id="lg" style="display:none"></div>
  </section>
</main>
<script>
let ws, state = { peers: [], messages: [], public: [] }, active = "#nearby";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("conn").textContent = "live"; $("conn").className = "chip on"; };
  ws.onclose = () => { $("conn").textContent = "reconnecting..."; $("conn").className = "chip"; setTimeout(connect, 1500); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function handle(ev) {
  switch (ev.type) {
    case "state":
      state = ev; $("me").textContent = "NearbyChat: " + ev.username;
      $("fp").textContent = "id " + ev.fingerprint;
      $("links").innerHTML = ev.transports.map((t) => `<span class="chip">${t.toUpperCase()}</span>`).join(" ");
      state.public = ev.public || []; $("relay").checked = ev.relay; renderStats(ev.stats); renderPeers(); renderChat(); break;
    case "peers": state.peers = ev.peers; renderPeers(); renderChatHead(); break;
    case "stats": renderStats(ev.stats); break;
    case "message": {
      const i = state.messages.findIndex((m) => m.id === ev.message.id && m.mine === ev.message.mine);
      if (i >= 0) state.messages[i] = ev.message; else state.messages.push(ev.message);
      renderPeers(); renderChat(); break;
    }
    case "public": state.public.push(ev.message); renderPeers(); renderChat(); break;
    case "packet": addPacket(ev); break;
    case "log": addLog(ev); break;
  }
}
function renderStats(s) {
  if (s) $("stats").textContent = `sent ${s.sent}  recv ${s.received}  relayed ${s.relayed}  acks ${s.acks}  dup ${s.duplicates}  dropped ${s.dropped}`;
}
function renderPeers() {
  const box = $("peers");
  if (box.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  const last = state.public.length ? state.public[state.public.length - 1] : null;
  let html = `<div class="peer ${active === "#nearby" ? "active" : ""}" data-pk="#nearby">
    <div class="top"><span><span class="dot on"></span><span class="name">#nearby</span> <span class="kind">public room</span></span>
    <span class="meta">${state.public.length || ""}</span></div>
    <div class="meta">${last ? esc(last.sender) + ": " + esc(last.text) : "Everyone in the mesh. Signed, not encrypted."}</div></div>`;
  if (!state.peers.length) html += '<div class="empty">Scanning for NearbyChat devices over Bluetooth...</div>';
  html += state.peers.map((p) => {
    const unread = state.messages.filter((m) => m.peer === p.publicKey && !m.mine).length;
    const how = p.direct ? `direct BLE${p.rssi != null ? " · " + p.rssi + " dBm" : ""}`
      : (p.online ? `mesh · ${p.hops} hop${p.hops === 1 ? "" : "s"} away` : "out of reach");
    return `<div class="peer ${active === p.publicKey ? "active" : ""}" data-pk="${p.publicKey}">
      <div class="top"><span><span class="dot ${p.online ? "on" : ""}"></span><span class="name">${esc(p.username)}</span>
      <span class="kind">${p.kind}</span></span><span class="meta">${unread ? unread + " msg" : ""}</span></div>
      <div class="meta mono">${p.fingerprint}</div>
      <div class="meta">${how}</div>
      ${p.links.length || p.blocked ? `<div class="routebox" onclick="event.stopPropagation()">
        <label title="Ignore the direct link so traffic must be relayed through the mesh"><input type="checkbox" data-block="${p.publicKey}" ${p.blocked ? "checked" : ""}> out of range (force multi-hop)</label></div>` : ""}
      </div>`;
  }).join("");
  box.innerHTML = html;
  box.querySelectorAll(".peer").forEach((el) => el.onclick = () => { active = el.dataset.pk; renderPeers(); renderChat(); });
  box.querySelectorAll("[data-block]").forEach((el) => el.onchange = () =>
    send({ action: "block", peer: el.dataset.block, blocked: el.checked }));
}
function renderChatHead() {
  $("text").disabled = false; $("sendbtn").disabled = false;
  if (active === "#nearby") {
    $("text").placeholder = "Message everyone in the mesh (#nearby)";
    $("chathead").innerHTML = `<div><b>#nearby</b> <span class="kind">public room</span></div>
      <div class="safety">Flooded hop by hop to every device (TTL 7). Each message is Ed25519 signed, so nobody can post as someone else. Not encrypted.</div>`;
    return;
  }
  const p = state.peers.find((x) => x.publicKey === active);
  $("text").placeholder = "Type an encrypted message";
  if (!p) { $("text").disabled = true; $("sendbtn").disabled = true; return; }
  $("chathead").innerHTML = `<div><b>${esc(p.username)}</b> <span class="kind">${p.kind}</span></div>
    <div class="safety">Safety number <span class="mono">${esc(p.safety || "-")}</span> (compare with the other screen) · ${esc(p.nextHop)}${p.hops && !p.direct ? " · " + p.hops + " hops" : ""}</div>`;
}
function renderChat() {
  renderChatHead();
  const box = $("msgs");
  if (active === "#nearby") {
    box.innerHTML = state.public.length ? state.public.map((m) => `<div class="bubble ${m.mine ? "mine" : ""}">
      ${m.mine ? "" : `<div class="st" style="color:#333;font-weight:bold">${esc(m.sender)} · ${m.fingerprint}</div>`}
      ${esc(m.text)}<div class="st">${new Date(m.ts).toLocaleTimeString()}${m.mine ? "" : " · " + m.hops + " hop" + (m.hops === 1 ? "" : "s")}</div></div>`).join("")
      : '<div class="empty">No public messages yet.</div>';
    box.scrollTop = box.scrollHeight;
    return;
  }
  const list = state.messages.filter((m) => m.peer === active);
  box.innerHTML = list.length ? list.map((m) => {
    const t = new Date(m.ts).toLocaleTimeString();
    const st = m.mine ? `${m.status}${m.route ? " · " + esc(m.route) : ""}` : "received";
    const retry = m.mine && m.status === "failed" ? ` <a href="#" data-retry="${m.id}" >retry</a>` : "";
    return `<div class="bubble ${m.mine ? "mine" : ""}">${esc(m.body)}<div class="st ${m.status}">${t} · ${st}${retry}</div></div>`;
  }).join("") : '<div class="empty">No messages yet. Private messages are end to end encrypted (X25519 + AES-GCM-256); relays cannot read them.</div>';
  box.querySelectorAll("[data-retry]").forEach((a) => a.onclick = (e) => { e.preventDefault(); send({ action: "resend", id: a.dataset.retry }); });
  box.scrollTop = box.scrollHeight;
}
function addPacket(ev) {
  const el = document.createElement("div");
  el.className = "pkt";
  const label = { in: "IN", out: "OUT", relay: "RELAY", drop: "DROP", replay: "REPLAY" }[ev.dir] || ev.dir;
  el.innerHTML = `<div class="row1"><span class="tag ${ev.dir}">${label}</span><b>${ev.kind}</b>
    <span class="mono">${ev.id}</span><span>${esc(ev.from)} → ${esc(ev.to)}</span>
    <span style="flex:1"></span><span class="meta">${ev.link.toUpperCase()} ${ev.bytes} B ${ev.ok ? "" : "✗"}</span></div>
    <div class="ct mono">${ev.ciphertext ? "ciphertext " + esc(ev.ciphertext) + "…" : "HMAC authenticated ACK"} ${ev.note ? "· " + esc(ev.note) : ""}</div>
    <pre>${esc(ev.raw)}</pre>`;
  el.onclick = () => el.classList.toggle("open");
  $("pk").prepend(el);
  while ($("pk").children.length > 200) $("pk").lastChild.remove();
}
function addLog(ev) {
  const el = document.createElement("div");
  el.className = "log " + ev.level;
  el.textContent = `${ev.time}  ${ev.text}`;
  $("lg").prepend(el);
}
$("composer").onsubmit = (e) => {
  e.preventDefault();
  const t = $("text").value.trim();
  if (!t || !active) return;
  if (active === "#nearby") send({ action: "public", text: t }); else send({ action: "send", to: active, text: t });
  $("text").value = "";
};
$("relay").onchange = () => send({ action: "relay", enabled: $("relay").checked });
$("tamper").onclick = () => send({ action: "tamper" });
$("replay").onclick = () => send({ action: "replay" });
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("sel", x === b));
  $("pk").style.display = b.dataset.tab === "pk" ? "" : "none";
  $("lg").style.display = b.dataset.tab === "lg" ? "" : "none";
});
connect();
</script>
</body>
</html>
